<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Complaint Generated</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light text-dark">
  <div class="container mt-5">
    <h2 class="text-success text-center">🎉 Complaint Generated</h2>
    <div class="card mt-3 p-3">
      <pre>{{ complaint }}</pre>
    </div>
    <form action="/download" method="POST" class="mt-3">
      <input type="hidden" name="complaint" value="{{ complaint }}">
      <button type="submit" class="btn btn-primary">📄 Download as PDF</button>
    </form>
    <form action="/send_email" method="POST" class="mt-3">
      <input type="hidden" name="complaint" value="{{ complaint }}">
      <input type="email" name="email" placeholder="Enter your email" class="form-control my-2" required>
      <button type="submit" class="btn btn-success">📧 Send to Email</button>
    </form>
    <a href="/" class="btn btn-secondary mt-3">⬅️ Go Back</a>
  </div>
</body>
</html>
