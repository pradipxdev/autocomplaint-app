<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Complaint Generated</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light text-dark">
  <div class="container mt-5">
    <h2 class="text-success text-center">🎉 Complaint Successfully Generated</h2>
    
    <div class="card mt-4 p-4 shadow">
      <pre class="mb-0">{{ complaint }}</pre>
    </div>

    <!-- PDF Download Form -->
    <form action="/download" method="POST" class="mt-4">
      <input type="hidden" name="complaint" value="{{ complaint }}">
      <button type="submit" class="btn btn-primary w-100">📄 Download as PDF</button>
    </form>

    <!-- Email Form -->
    <form action="/send_email" method="POST" class="mt-3">
      <input type="hidden" name="name" value="{{ data.name }}">
      <input type="hidden" name="issue" value="{{ data.issue }}">
      <input type="hidden" name="against" value="{{ data.against }}">
      <input type="hidden" name="date" value="{{ data.date }}">
      <input type="hidden" name="location" value="{{ data.location }}">
      <input type="hidden" name="description" value="{{ data.description }}">
      <div class="input-group">
        <input type="email" name="email" placeholder="Enter your email" class="form-control" required>
        <button type="submit" class="btn btn-success">📧 Send to Email</button>
      </div>
    </form>

    <div class="text-center mt-4">
      <a href="/" class="btn btn-outline-secondary">⬅️ Generate Another Complaint</a>
    </div>
  </div>
</body>
</html>
