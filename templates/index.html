<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AutoComplaint Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <div class="card shadow p-4">
      <h2 class="mb-4 text-center text-primary">📝 AutoComplaint Generator</h2>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Issue</label>
          <input type="text" name="issue" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Against</label>
          <input type="text" name="against" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Date</label>
          <input type="date" name="date" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Location</label>
          <input type="text" name="location" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Description</label>
          <textarea name="description" class="form-control" rows="3" required></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label">Your Email (to receive the complaint)</label>
          <input type="email" name="email" class="form-control">
        </div>
        <button class="btn btn-primary w-100">📤 Generate & Download Complaint</button>
      </form>
    </div>
  </div>
</body>
</html>
