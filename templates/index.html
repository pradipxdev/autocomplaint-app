<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AutoComplaint Generator</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-dark text-light">
  <div class="container mt-5">
    <h1 class="text-center text-warning mb-4">🛡️ AutoComplaint Generator</h1>
    
    <!-- Complaint Form -->
    <form method="POST" id="complaintForm">
      <div class="mb-3">
        <label class="form-label">Your Name</label>
        <input type="text" name="name" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Your Email (for sending complaint)</label>
        <input type="email" name="email" class="form-control" placeholder="you@example.com">
      </div>
      <div class="mb-3">
        <label class="form-label">Issue</label>
        <input type="text" name="issue" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Against (Person/Org)</label>
        <input type="text" name="against" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Date</label>
        <input type="date" name="date" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Location</label>
        <input type="text" name="location" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-control" rows="4" required></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">Language</label>
        <select name="language" class="form-select">
          <option value="en">English</option>
          <option value="hi">Hindi</option>
        </select>
      </div>

      <!-- Submit Buttons -->
      <div class="d-flex flex-column flex-md-row gap-3">
        <button type="submit" formaction="/" class="btn btn-warning w-100">🪄 Generate Complaint</button>
        <button type="submit" formaction="/generate_pdf" class="btn btn-outline-info w-100">📤 Export as PDF</button>
        <button type="submit" formaction="/send_email" class="btn btn-success w-100">📧 Send as Email</button>
      </div>
    </form>
  </div>
</body>
</html>
